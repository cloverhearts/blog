# Shared route policy. Blog design details do not belong here.
schemaVersion: 5
trailingSlash: "always"
paginationSegment: "page"
# These are locale-neutral logical routes. The URL resolver leaves Korean
# unprefixed and prepends the configured prefix for English and Japanese.
paths:
  home: "/"
  posts: "/posts/"
  categories: "/categories/"
  tags: "/tags/"
  archive: "/archive/"
  search: "/search/"
  explore: "/explore/"
  notFound: "/404/"
  assets: "/_assets/"
  contentAssets: "/_assets/content/"
  managedAssets: "/_assets/managed/"
  rss: "/rss.xml"
  sitemap: "/sitemap.xml"
  llms: "/llms.txt"
# Curated collection routes are a dynamic map. Adding a collection that uses
# existing selector/order/presentation vocabulary does not require a new
# TypeScript property.
curated:
  work: "/work/"
  daily: "/daily/"
reservedPrefixes:
  - "/_assets/"
  - "/search/"
reservedFiles:
  - "/llms.txt"
  - "/robots.txt"
  - "/rss.xml"
  - "/sitemap.xml"
