# Optional, privacy-gated analytics for the normal blog application.
# Set the public build variable below to the Clarity project's alphanumeric ID.
# Blank disables analytics; old GA4 consent never authorizes session recording.
schemaVersion: 2
provider: "microsoft-clarity"
projectIdEnvironmentVariable: "CLARITY_PROJECT_ID"
enabledWhenConfigured: true
scope:
  blog: true
  managedPages: false
consent:
  mode: "basic"
  default: "denied"
  storageKey: "blog.clarity-consent.v1"
collection:
  advertisingStorage: false
  maskText: true
  skipQueryPages: true
  collectRawSearchTerms: false
  preview: false
