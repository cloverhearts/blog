# Shared site values. Production deployment values are injected and validated
# by the build rather than hard-coded in a package.
schemaVersion: 7
originEnvironmentVariable: "SITE_ORIGIN"
basePathEnvironmentVariable: "SITE_BASE_PATH"
production:
  origin: "https://blog.cloverhearts.com"
  basePath: ""
identity:
  name: "CloverHearts Labs"
  descriptions:
    en: "Field notes on verifiable AI workflows, software systems, and everyday life."
    ko: "검증 가능한 AI 워크플로와 소프트웨어 시스템, 그리고 일상을 기록합니다."
    ja: "検証可能なAIワークフローとソフトウェアシステム、日々の暮らしを記録します。"
  owner:
    displayName: "CloverHearts"
    shortBios:
      en: "An AI workflow engineer writing about systems, experiments, and life beyond work."
      ko: "AI Workflow Engineer로서 시스템과 실험, 일 밖의 삶을 기록합니다."
      ja: "AI Workflow Engineerとして、システムと実験、仕事の外の暮らしを記録します。"
    profileRoutes:
      en: "/en/profile/"
      ko: "/profile/"
      ja: "/ja/profile/"
    contacts:
      - id: "github"
        kind: "github"
        labels:
          en: "GitHub"
          ko: "GitHub"
          ja: "GitHub"
        href: "https://github.com/cloverhearts"
languages:
  default: "ko"
  source: "ko"
  primaryExperience:
    - "ko"
    - "en"
  browserSelection: "manual-only"
  postNavigationFallback:
    - "en"
    - "ko"
  supported:
    - id: "ko"
      htmlLang: "ko"
      hreflang: "ko"
      ogLocale: "ko_KR"
      routePrefix: ""
      nativeLabel: "한국어"
    - id: "en"
      htmlLang: "en"
      hreflang: "en"
      ogLocale: "en_US"
      routePrefix: "/en"
      nativeLabel: "English"
    - id: "ja"
      htmlLang: "ja"
      hreflang: "ja"
      ogLocale: "ja_JP"
      routePrefix: "/ja"
      nativeLabel: "日本語"
timezone: "Asia/Seoul"
defaultManagedPageReturnTo: "/"
search:
  includePosts: true
  includeManagedPages: false
listings:
  pageSize: 10
relatedPosts:
  maxItems: 4
feeds:
  rss: true
  sitemap: true
