# Build-time embed plugin registry and global safety policy.
schemaVersion: 1
plugins:
  - id: "youtube"
    package: "@cloverhearts/embed-youtube"
    enabled: true
    configuration:
      embedOrigin: "https://www.youtube-nocookie.com"
policy:
  allowRemotePluginPackages: false
  allowNetworkDuringBuild: false
  allowRawHtml: false
  requireStaticFallback: true
  requireAccessibleTitle: true
  requireExplicitSecurityOrigins: true
  requirePrivacyDeclaration: true
  allowProgressiveClientEnhancement: true
