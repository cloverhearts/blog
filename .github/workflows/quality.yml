name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate configuration
        run: npm run validate:config

      - name: Type-check sources
        run: npm run typecheck

      - name: Run contract and policy tests
        run: npm test

      - name: Build production and portability variants
        env:
          SITE_ORIGIN: https://blog.cloverhearts.com
          SITE_BASE_PATH: ""
        run: |
          npm run build
          SITE_BASE_PATH=/blog npm run build:web
          npm run verify:pages
